<section id="contact">

    <h2>문의</h2>
    <form>
      <div>
        <label for="name">이름</label>
        <br>
        <input
        id="name"
        type="text"
        placeholder="이름을 입력하세요.">

      </div>

      <br>

      <div>
        <label for="email">이메일</label>
        <br>

        <input
        id="email"
        type="email"
        placeholder="example@email.com">
        </div>

        <br>

        <div>
          <label for="massage">문의내용</label>
          <br>

          <textarea
          id="massage"
          rows="5"
          cols="40"
          placeholder="문의 내용을 입력하세요."></textarea>
        </div>

        <br>

        <button type="submit">
          <a class="btn" >
          문의하기
           </a>
        </button>


    </form>
