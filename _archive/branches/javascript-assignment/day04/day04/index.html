<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영화 검색</title>
  </head>

  <body>
    <h1>영화 검색</h1>

    <button id="recommend-button">영화 추천 받기</button>

    <p id="recommend-result"></p>

    <hr />

    <form id="search-form">
      <input
        type="text"
        id="search-input"
        placeholder="영화 제목을 입력하세요."
      />
      <button type="submit">검색</button>
    </form>

    <p id="search-result"></p>

    <hr />

    <h2>현재 상영 영화</h2>

    <ul id="movie-list"></ul>

    <script src="script.js"></script>
  </body>
</html>
